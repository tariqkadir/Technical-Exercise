name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Load Docker image
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: golang-app:test

      - name: Run the image
        run: docker run --rm -d -p 80:3000 golang-app:test

      # name: run tests
      #  uses: liatrio/github-actions/apprentice-action@master

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' || github.head_ref == 'feat/gh_actions'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        if: github.event_name != 'pull_request' || github.head_ref == 'feat/gh_actions'
        run: docker tag golang-app:test ${{ vars.DOCKER_USERNAME }}/repository:v${{ github.run_number }}.${{ github.run_attempt }}

      - name: Push Docker image
        if: github.event_name != 'pull_request' || github.head_ref == 'feat/gh_actions'
        run: docker image push ${{ vars.DOCKER_USERNAME }}/repository:v${{ github.run_number }}.${{ github.run_attempt }}
